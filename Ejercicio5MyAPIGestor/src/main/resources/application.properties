spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Configuración dinámica para despliegue Local, Docker y Cloud
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbgestor}}
spring.datasource.username=${DB_USER:root}
# La contraseña se lee de la variable de entorno DB_PASSWORD (no se sube a GitHub)
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Swagger UI -> http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true

# Monitoreo y Observabilidad (Actuator + Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
