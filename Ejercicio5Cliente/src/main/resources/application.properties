spring.application.name=Ejercicio5Cliente
server.port=${PORT:8080}

# F-01: URL base de la API consumida por GestorController (dinámica para local, docker y cloud)
api.url=${API_URL:http://localhost:8081}

# Monitoreo y Observabilidad (Actuator + Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
