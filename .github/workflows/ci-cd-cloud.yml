name: Pipeline DevOps CI/CD Cloud - Admin Proyectos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ===================================================================
  # 1. Compilación, Pruebas Unitarias y Cobertura JaCoCo (JDK 21)
  # ===================================================================
  build-and-test:
    name: Compilación y Pruebas (Backend y Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 1.2 Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ----------------- BACKEND -----------------
      - name: 1.3 Compilar y Probar Backend (Ejercicio5MyAPIGestor)
        working-directory: ./Ejercicio5MyAPIGestor
        run: |
          mvn -B test-compile
          mvn -B test
          mvn -B jacoco:report jacoco:check

      - name: 1.4 Publicar Reportes JUnit Backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports-backend
          path: Ejercicio5MyAPIGestor/target/surefire-reports/*.xml

      - name: 1.5 Publicar Reporte Cobertura JaCoCo Backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-backend
          path: Ejercicio5MyAPIGestor/target/site/jacoco/

      # ----------------- FRONTEND -----------------
      - name: 1.6 Compilar y Probar Frontend (Ejercicio5Cliente)
        working-directory: ./Ejercicio5Cliente
        run: |
          mvn -B test-compile
          mvn -B test
          mvn -B jacoco:report jacoco:check

      - name: 1.7 Publicar Reportes JUnit Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports-frontend
          path: Ejercicio5Cliente/target/surefire-reports/*.xml

      - name: 1.8 Publicar Reporte Cobertura JaCoCo Frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-frontend
          path: Ejercicio5Cliente/target/site/jacoco/

  # ===================================================================
  # 2. Análisis Estático SAST y Seguridad (Semgrep & Trivy)
  # ===================================================================
  security-and-quality:
    name: Calidad de Código y Seguridad SAST
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 2.2 Escaneo SAST de Vulnerabilidades con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
        continue-on-error: true

      - name: 2.3 Escaneo de Vulnerabilidades y Secretos con Aqua Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          skip-dirs: 'target,Ejercicio5MyAPIGestor/target,Ejercicio5Cliente/target,docs'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 2.4 Análisis de Calidad SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar -Dsonar.organization=jaquelinecamarillo -Dsonar.projectKey=JaquelineCamarillo_admin-proyectos -Dsonar.host.url=https://sonarcloud.io || true

  # ===================================================================
  # 3. Validación de Infraestructura como Código (IaC con Terraform)
  # ===================================================================
  iac-validation:
    name: Validación IaC (Terraform y Render)
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 3.2 Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: 3.3 Inicializar y Validar Código Terraform
        working-directory: ./iac/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: 3.4 Validar Especificación Blueprint de Render
        run: |
          test -f render.yaml && echo "render.yaml presente y válido"

  # ===================================================================
  # 4. Construcción de Imágenes Docker y Empaquetado de Microservicios
  # ===================================================================
  container-build:
    name: Construcción de Contenedores Docker
    needs: [build-and-test, iac-validation]
    runs-on: ubuntu-latest

    steps:
      - name: 4.1 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 4.2 Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 4.3 Empaquetar JAR Backend
        working-directory: ./Ejercicio5MyAPIGestor
        run: mvn -B package -DskipTests

      - name: 4.4 Construir Imagen Docker Backend
        run: |
          docker build -t admin-proyectos-backend:latest ./Ejercicio5MyAPIGestor

      - name: 4.5 Empaquetar JAR Frontend
        working-directory: ./Ejercicio5Cliente
        run: mvn -B package -DskipTests

      - name: 4.6 Construir Imagen Docker Frontend
        run: |
          docker build -t admin-proyectos-frontend:latest ./Ejercicio5Cliente

      - name: 4.7 Resumen de Contenedores Construidos
        run: |
          docker images | grep admin-proyectos
